spring.application.name=AIShop
server.port=8081

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AIShop;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=86400
app.refresh-token.expiration-days=7

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL}
spring.ai.ollama.chat.options.temperature=0.2

#MCP Server
spring.ai.mcp.server.name=aishop-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.annotation-scanner.enabled=true

#MCP Client
spring.ai.mcp.client.enabled=false

#Local MCP Server connection
app.mcp.base-url=${MCP_BASE_URL:http://localhost:8081}

stripe.api.key=${STRIPE_API_KEY}

stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
